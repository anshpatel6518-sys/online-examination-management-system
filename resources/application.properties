# ==============================================================================
# Server Configuration
# ==============================================================================
server.port=8080

# ==============================================================================
# MySQL Database Configuration
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/exam_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# Thymeleaf Configuration
# ==============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==============================================================================
# Application & Email Notification Configuration
# ==============================================================================
# Toggle to enable/disable actual SMTP delivery. When false, mail messages are logged instead of sent.
app.mail.enabled=false
app.mail.from=no-reply@examportal.edu
app.app-url=http://localhost:8080

# Spring Mail SMTP Settings (placeholders)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

