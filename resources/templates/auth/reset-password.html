<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Online Examination System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Institutional Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

    <div class="auth-card">
        <!-- Institutional Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center p-2 mb-2">
                <i class="bi bi-shield-lock fs-2 text-dark"></i>
            </div>
            <h1 class="h5 fw-bold text-dark mb-1">Set New Password</h1>
            <p class="text-secondary small mb-0">Please enter and confirm your new secure password.</p>
        </div>

        <!-- Reset Password Form -->
        <form th:action="@{/reset-password}" th:object="${resetPasswordDto}" method="post">
            <input type="hidden" th:field="*{token}">

            <div class="mb-3">
                <label for="newPassword" class="form-label small fw-medium text-dark">New Password (Min 8 chars)</label>
                <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control form-control-sm"
                       placeholder="Enter new password" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''" required autofocus>
                <div class="invalid-feedback small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label small fw-medium text-dark">Confirm New Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control form-control-sm"
                       placeholder="Re-enter new password" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''" required>
                <div class="invalid-feedback small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn btn-dark btn-sm w-100 py-2 fw-medium mt-2">
                Update Password
            </button>
        </form>

        <!-- Back to Sign In -->
        <div class="border-top pt-3 mt-4 text-center">
            <p class="text-secondary small mb-0">
                Cancel and return to <a th:href="@{/login}" class="fw-medium text-dark text-decoration-underline">Sign In</a>
            </p>
        </div>
    </div>

    <!-- Minimal Institutional Footer -->
    <div class="text-secondary small text-center mt-3">
        &copy; Online Examination Management System
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
