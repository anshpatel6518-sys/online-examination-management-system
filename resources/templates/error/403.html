<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - 403</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Institutional Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

    <div class="auth-card text-center" style="max-width: 460px;">
        <div class="d-inline-flex align-items-center justify-content-center p-3 mb-3 border rounded-circle bg-light">
            <i class="bi bi-shield-x fs-1 text-danger"></i>
        </div>
        <h1 class="h4 fw-bold text-dark mb-1">403 - Access Denied</h1>
        <p class="text-secondary small mb-4">
            You do not have the required role or permissions to access this institutional resource.
        </p>

        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/login}" class="btn btn-dark btn-sm py-2 px-3">
                Return to Login
            </a>
            <a th:href="@{/}" class="btn btn-outline-dark btn-sm py-2 px-3">
                Home Page
            </a>
        </div>
    </div>

    <div class="text-secondary small text-center mt-3">
        &copy; Online Examination Management System
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
