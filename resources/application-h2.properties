# ==============================================================================
# H2 In-Memory Profile Configuration
# Use with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ==============================================================================

# H2 In-Memory Database with MySQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:exam_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail simulation
app.mail.enabled=false
app.app-url=http://localhost:8080
