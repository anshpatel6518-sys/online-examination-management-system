<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Online Examination System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Institutional Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

    <div class="auth-card">
        <!-- Institutional Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center p-2 mb-2">
                <i class="bi bi-key fs-2 text-dark"></i>
            </div>
            <h1 class="h5 fw-bold text-dark mb-1">Reset Password</h1>
            <p class="text-secondary small mb-0">Enter your registered email address to receive password reset instructions.</p>
        </div>

        <!-- Forgot Password Form -->
        <form th:action="@{/forgot-password}" th:object="${forgotPasswordDto}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label small fw-medium text-dark">Registered Email Address</label>
                <input type="email" id="email" th:field="*{email}" class="form-control form-control-sm"
                       placeholder="user@college.edu" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required autofocus>
                <div class="invalid-feedback small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <button type="submit" class="btn btn-dark btn-sm w-100 py-2 fw-medium mt-2">
                Send Reset Link
            </button>
        </form>

        <!-- Back to Sign In -->
        <div class="border-top pt-3 mt-4 text-center">
            <p class="text-secondary small mb-0">
                Remember your password? <a th:href="@{/login}" class="fw-medium text-dark text-decoration-underline">Back to Sign In</a>
            </p>
        </div>
    </div>

    <!-- Minimal Institutional Footer -->
    <div class="text-secondary small text-center mt-3">
        &copy; Online Examination Management System
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
