<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Online Examination System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Institutional Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

    <div class="auth-card" style="max-width: 480px;">
        <!-- Institutional Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center p-2 mb-2">
                <i class="bi bi-person-plus fs-2 text-dark"></i>
            </div>
            <h1 class="h5 fw-bold text-dark mb-1">Online Examination System</h1>
            <p class="text-secondary small mb-0">Portal Account Registration</p>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/register}" th:object="${user}" method="post">
            
            <!-- Full Name -->
            <div class="mb-3">
                <label for="fullName" class="form-label small fw-medium text-dark">Full Name</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="form-control form-control-sm" placeholder="Enter full name" required>
                <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger small mt-1"></div>
            </div>

            <!-- Email Address -->
            <div class="mb-3">
                <label for="email" class="form-label small fw-medium text-dark">Email Address</label>
                <input type="email" id="email" th:field="*{email}" class="form-control form-control-sm" placeholder="user@college.edu" required>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-1"></div>
            </div>

            <!-- Role Selection -->
            <div class="mb-3">
                <label for="role" class="form-label small fw-medium text-dark">Account Role</label>
                <select id="role" th:field="*{role}" class="form-select form-select-sm" required>
                    <option value="" disabled selected>Select your institutional role</option>
                    <option value="STUDENT">Student</option>
                    <option value="TEACHER">Teacher</option>
                </select>
                <div th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="text-danger small mt-1"></div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label small fw-medium text-dark">Password</label>
                <input type="password" id="password" th:field="*{password}" class="form-control form-control-sm" placeholder="Minimum 8 characters" required>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger small mt-1"></div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label for="confirmPassword" class="form-label small fw-medium text-dark">Confirm Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control form-control-sm" placeholder="Re-enter password" required>
                <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-danger small mt-1"></div>
            </div>

            <button type="submit" class="btn btn-dark btn-sm w-100 py-2 fw-medium mt-2">
                Create Account
            </button>
        </form>

        <!-- Link back to Sign In -->
        <div class="border-top pt-3 mt-4 text-center">
            <p class="text-secondary small mb-0">
                Already registered? <a th:href="@{/login}" class="fw-medium text-dark text-decoration-underline">Sign in here</a>
            </p>
        </div>
    </div>

    <!-- Minimal Institutional Footer -->
    <div class="text-secondary small text-center mt-3">
        &copy; Online Examination Management System
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
