<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Exam Results')}"></head>
<body class="bg-white d-flex flex-column min-vh-100">

    <!-- Navbar Fragment -->
    <header th:replace="~{layout/navbar :: navbar}"></header>

    <!-- Main Layout Container (Sidebar + Content) -->
    <div class="d-flex flex-grow-1">
        
        <!-- Sidebar Fragment with 'results' active -->
        <div th:replace="~{layout/sidebar :: sidebar('results')}"></div>

        <!-- Main Page Content -->
        <main class="flex-grow-1 p-3 p-md-4 p-lg-4 overflow-auto">
            <div class="container-fluid px-0">

                <!-- Page Header -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center pb-3 mb-4 border-bottom gap-2">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-1">Examination Performance &amp; Results</h1>
                        <p class="text-secondary small mb-0">Evaluate student submissions, average scores, and pass rates across your course assessments.</p>
                    </div>
                </div>

                <!-- Reusable Flash Alerts Fragment -->
                <div th:replace="~{layout/alerts :: alerts}"></div>

                <!-- Exams Results Catalog Card -->
                <div class="card border mb-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Examination</th>
                                    <th>Course</th>
                                    <th>Candidates</th>
                                    <th>Average Score</th>
                                    <th>Pass Rate</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${summaries == null or summaries.empty}">
                                    <td colspan="7" class="text-center py-5">
                                        <div th:replace="~{layout/alerts :: emptyState('bi-clipboard-data', 'No Exam Records', 'You have not created any examinations yet. Schedule exams and publish them to track student performance.')}"></div>
                                    </td>
                                </tr>
                                <tr th:each="s : ${summaries}">
                                    <!-- Title -->
                                    <td class="fw-semibold text-dark">
                                        <span th:text="${s.examTitle}">Mid-Term Exam</span>
                                    </td>

                                    <!-- Course -->
                                    <td>
                                        <span class="badge bg-light text-dark border" th:text="${s.courseCode}">CS101</span>
                                        <div class="text-secondary small" th:text="${s.courseName}">Data Structures</div>
                                    </td>

                                    <!-- Candidates -->
                                    <td>
                                        <span class="fw-bold text-dark" th:text="${s.totalCandidates}">0</span>
                                        <span class="text-secondary small">submissions</span>
                                    </td>

                                    <!-- Average Score -->
                                    <td>
                                        <span class="fw-semibold text-dark" th:text="${s.averageScore}">0.0</span>
                                        <span class="text-secondary small">/ <span th:text="${s.totalMarks}">100</span></span>
                                    </td>

                                    <!-- Pass Rate -->
                                    <td>
                                        <span class="fw-semibold" 
                                              th:classappend="${s.passPercentage >= 50.0 ? 'text-success' : 'text-danger'}"
                                              th:text="${s.passPercentage + '%'}">
                                            0.0%
                                        </span>
                                    </td>

                                    <!-- Pass Standard -->
                                    <td>
                                        <span class="badge bg-light text-secondary border">
                                            Pass: <span th:text="${s.passingMarks}">40</span> marks
                                        </span>
                                    </td>

                                    <!-- Actions -->
                                    <td class="text-end">
                                        <a th:href="@{/teacher/exams/{id}/results(id=${s.examId})}" class="btn btn-dark btn-sm py-1 px-3">
                                            <i class="bi bi-bar-chart me-1"></i> View Results
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Footer Fragment -->
    <footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
