<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Enroll Student')}"></head>
<body class="bg-white d-flex flex-column min-vh-100">

    <!-- Navbar Fragment -->
    <header th:replace="~{layout/navbar :: navbar}"></header>

    <!-- Main Layout Container (Sidebar + Content) -->
    <div class="d-flex flex-grow-1">
        
        <!-- Sidebar Fragment with 'users' active -->
        <div th:replace="~{layout/sidebar :: sidebar('users')}"></div>

        <!-- Main Page Content -->
        <main class="flex-grow-1 p-3 p-md-4 p-lg-4 overflow-auto">
            <div class="container-fluid px-0" style="max-width: 680px;">

                <!-- Page Header with Back Link -->
                <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-1">Student Course Enrollment</h1>
                        <p class="text-secondary small mb-0">Assign curriculum courses to the student to grant examination eligibility.</p>
                    </div>
                    <a th:href="@{/admin/users}" class="btn btn-outline-dark btn-sm py-1 px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back to Users
                    </a>
                </div>

                <!-- Reusable Flash Alerts Fragment -->
                <div th:replace="~{layout/alerts :: alerts}"></div>

                <!-- Student Info & Enrollment Form Card -->
                <div class="card border mb-4">
                    <div class="card-header bg-light">
                        <span class="fw-semibold text-dark">Student Credentials</span>
                    </div>
                    <div class="card-body p-4 border-bottom">
                        <div class="row g-2">
                            <div class="col-sm-6">
                                <span class="small text-secondary">Student Name:</span>
                                <div class="fw-bold text-dark" th:text="${enrollment.studentName}">Student Full Name</div>
                            </div>
                            <div class="col-sm-6">
                                <span class="small text-secondary">Student Email:</span>
                                <div class="text-dark" th:text="${enrollment.studentEmail}">student@college.edu</div>
                            </div>
                        </div>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/admin/users/{id}/enroll(id=${enrollment.studentId})}" method="post">
                            <h6 class="fw-semibold text-dark mb-3">Select Courses for Enrollment:</h6>

                            <div th:if="${courses == null or courses.empty}" class="text-secondary small py-3">
                                No courses have been configured in the curriculum yet.
                            </div>

                            <div th:if="${courses != null and !courses.empty}" class="d-flex flex-column gap-2 mb-4">
                                <div th:each="c : ${courses}" class="form-check p-3 border rounded bg-light">
                                    <input class="form-check-input ms-0 me-3" 
                                           type="checkbox" 
                                           name="courseIds" 
                                           th:value="${c.id}" 
                                           th:id="'course_' + ${c.id}"
                                           th:checked="${enrollment.courseIds != null and enrollment.courseIds.contains(c.id)}">
                                    <label class="form-check-label w-100" th:for="'course_' + ${c.id}">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span class="fw-bold text-dark" th:text="${c.code} + ' - ' + ${c.name}">CS101</span>
                                            <span class="badge bg-white text-secondary border small" 
                                                  th:text="${c.teacher != null ? c.teacher.fullName : 'Unassigned'}">Faculty</span>
                                        </div>
                                        <div class="text-secondary small mt-1" th:text="${c.description != null ? #strings.abbreviate(c.description, 80) : 'No description'}">
                                            Description snippet...
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <!-- Form Actions -->
                            <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                                <a th:href="@{/admin/users}" class="btn btn-outline-dark btn-sm px-3 py-2">Cancel</a>
                                <button type="submit" class="btn btn-dark btn-sm px-4 py-2">
                                    <i class="bi bi-check2 me-1"></i> Save Enrollments
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Footer Fragment -->
    <footer th:replace="~{layout/footer :: footer}"></footer>

    <!-- Bootstrap Scripts Fragment -->
    <th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
