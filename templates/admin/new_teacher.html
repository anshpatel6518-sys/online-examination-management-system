<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Add Teacher')}"></head>
<body class="bg-white d-flex flex-column min-vh-100">

    <!-- Navbar Fragment -->
    <header th:replace="~{layout/navbar :: navbar}"></header>

    <!-- Main Layout Container (Sidebar + Content) -->
    <div class="d-flex flex-grow-1">
        
        <!-- Sidebar Fragment with 'users' active -->
        <div th:replace="~{layout/sidebar :: sidebar('users')}"></div>

        <!-- Main Page Content -->
        <main class="flex-grow-1 p-3 p-md-4 p-lg-4 overflow-auto">
            <div class="container-fluid px-0" style="max-width: 650px;">

                <!-- Page Header with Back Button -->
                <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-1">Add Teacher Account</h1>
                        <p class="text-secondary small mb-0">Onboard faculty members to author courses and exams.</p>
                    </div>
                    <a th:href="@{/admin/users}" class="btn btn-outline-dark btn-sm py-1 px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back to Users
                    </a>
                </div>

                <!-- Reusable Flash Alerts Fragment -->
                <div th:replace="~{layout/alerts :: alerts}"></div>

                <!-- Teacher Creation Card -->
                <div class="card border">
                    <div class="card-header">
                        <span class="fw-semibold">Faculty Information</span>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/users/new-teacher}" th:object="${teacher}" method="post">
                            
                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label small fw-medium text-dark">Full Name <span class="text-danger">*</span></label>
                                <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. Prof. Katherine Johnson" required>
                                <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Email Address -->
                            <div class="mb-3">
                                <label for="email" class="form-label small fw-medium text-dark">Institutional Email <span class="text-danger">*</span></label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="e.g. kjohnson@college.edu" required>
                                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-1"></div>
                            </div>

                            <div class="row g-3 mb-4">
                                <!-- Password -->
                                <div class="col-12 col-sm-6">
                                    <label for="password" class="form-label small fw-medium text-dark">Password <span class="text-danger">*</span></label>
                                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Min. 8 characters" required>
                                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger small mt-1"></div>
                                </div>

                                <!-- Confirm Password -->
                                <div class="col-12 col-sm-6">
                                    <label for="confirmPassword" class="form-label small fw-medium text-dark">Confirm Password <span class="text-danger">*</span></label>
                                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Re-enter password" required>
                                    <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-danger small mt-1"></div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                                <a th:href="@{/admin/users}" class="btn btn-outline-dark btn-sm px-3 py-2">Cancel</a>
                                <button type="submit" class="btn btn-dark btn-sm px-4 py-2">
                                    <i class="bi bi-check2 me-1"></i> Create Teacher Account
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Footer Fragment -->
    <footer th:replace="~{layout/footer :: footer}"></footer>

    <!-- Bootstrap Scripts Fragment -->
    <th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
